name: lm_modify_cwe908
parameters:
  cwe_id: "CWE-908"
  cwe_name: "Use of Uninitialized Resource"
  bug_examples:
    - "Delete the assignment that sets a local variable before its first use in a conditional branch: remove `int len = 0;` so the variable is declared but never assigned on the path where the initializing branch is not taken, and downstream code uses the indeterminate value for a size, offset, or loop bound."
    - "Remove a `memset(buf, 0, sizeof(buf))` on a stack buffer that is only partially written by a decoder, so trailing bytes contain whatever was on the stack. The function then returns or hashes the full buffer, leaking stack contents into output."
    - "Change a `calloc(n, size)` (zero-initialized) to `malloc(n * size)` (uninitialized), so the allocated memory contains stale heap data. Code that reads the buffer before fully writing it operates on garbage values."
    - "Delete the initialization of a struct's pointer field (e.g., `node->child = NULL;`) in a constructor/init function, so a later `if (node->child != NULL)` check passes on stale memory and the code dereferences a wild pointer."
    - "Remove a default-case assignment in a switch that covers the variable's initialization: if `switch(type) { case A: val = 1; break; case B: val = 2; break; default: val = 0; break; }` is followed by `use(val)`, delete the `default` case so `val` is uninitialized for unknown types."
    - "Move a variable declaration from function scope (where it gets a default initializer) into a narrower block scope where it shadows the outer one but is never assigned, so the outer use after the block reads the original (now stale or uninitialized) variable."
    - "Delete the zeroing of an output parameter at function entry: remove `*out = 0;` or `*result = {};` at the top of a function that only writes `*out` on success, so on the error path the caller reads whatever was in `*out` before the call."
    - "Remove a loop that pre-fills an array with sentinel values (e.g., `for (i = 0; i < n; i++) table[i] = -1;`) before a sparse-population step, so unvisited slots contain stale data instead of sentinels and downstream lookups treat garbage as valid entries."
  tips:
    - "The bug must be a realistic use-of-uninitialized-resource flaw (CWE-908) — the program reads from a variable, buffer, struct field, or heap allocation that was never properly written before the read. This is distinct from CWE-665 (Improper Initialization) in that CWE-908 focuses on the USE of the uninitialized value, not just the missing init."
    - "Preserve the function signature and documentation. Do not rename identifiers."
    - "Do not introduce compilation errors; the variable/buffer must still be declared with a valid type."
    - "Do not add comments that hint at the flaw or mention uninitialized, garbage, CWE, or bug."
    - "The bug should be subtle: in debug builds or with zero-initialized stacks, the uninitialized value may happen to be zero and the function appears correct. The bug manifests in release builds, under ASAN/MSAN, or when stack/heap reuse puts non-zero data in the location."
    - "Prefer modifying exactly ONE initialization or assignment statement over restructuring the whole function."
    - "Do NOT remove bounds checks or input validators — that is CWE-20 / CWE-125 territory. Stay strictly in 'a resource is used before being initialized' territory."
    - "If the function has no local variables that require initialization, no buffers, no struct field writes, and no output parameters (e.g., a trivial getter, a single-expression return, or a pure computation with all values coming from parameters), respond with `NO_GOOD_BUG_SITE` instead of forcing a contrived change."
system: |-
  You are a security researcher performing adversarial bug injection to build a training dataset for automated vulnerability-detection and -repair agents.

  Your job is to rewrite the given function so it contains a realistic CWE-908 flaw (Use of Uninitialized Resource). The resulting function must still compile, keep its signature, and appear to work correctly in common test scenarios — the flaw should cause the function to read from an uninitialized variable, buffer, struct field, or heap allocation, producing indeterminate behavior that only surfaces under memory sanitizers, release builds, or specific call patterns that leave non-zero data on the stack/heap.

  Concretely, some kinds of CWE-908 bugs you should consider introducing:
  {% for bug in (bug_examples | shuffle)[:3] %}
  - {{ bug -}}
  {% endfor %}

  Tips about the bug-introducing task:
  {% for tip in tips | shuffle %}
  - {{ tip -}}
  {% endfor %}

  Your answer should be formatted as follows:

  Explanation:
  <explanation of what you changed and why it is a CWE-908 flaw — this explanation is for dataset metadata and will not appear in code>

  Bugged Code:
  ```
  <bugged_code>
  ```
demonstration: ""
instance: |-
  <INPUT>
  {{src_code}}
  </INPUT>

  <IMPORTANT>As a reminder, Please DO NOT INCLUDE ANY COMMENTS IN THE CODE OR POINT OUT THE BUG IN ANY WAY. The bugged function must compile and preserve its signature. If the function genuinely has no good CWE-908 site (e.g., a trivial getter, a single-expression return, or a pure computation where all values come from parameters), then respond with ONLY the bare line `NO_GOOD_BUG_SITE` on its own — do NOT wrap it in a code block, do NOT include an Explanation section, do NOT include a Bugged Code section. Any response without a fenced ```code``` block will be treated as a decline and discarded.</IMPORTANT>

