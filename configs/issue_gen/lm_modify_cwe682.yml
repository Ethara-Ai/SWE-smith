name: lm_modify_cwe682
parameters:
  cwe_id: "CWE-682"
  cwe_name: "Incorrect Calculation"
  bug_examples:
    - "Flip an off-by-one in a loop bound that walks a packed structure (restart-point array, block footer, skip-list level, varint decoder): change `for (i = 0; i < n; i++)` to `for (i = 0; i <= n; i++)` or `i < n - 1`, so the last or first element is silently mis-accounted. The function still returns a value on every input; downstream consumers only misbehave when they index into the off-by-one region."
    - "Swap operator precedence in an expression that mixes bitwise and arithmetic ops: change `(a & mask) + b` to `a & (mask + b)` (or `a << shift | b` vs `a << (shift | b)`), so the produced value is wrong on specific bit patterns but correct on the common zero/small-value fast path."
    - "Replace integer division with a floor computation that rounds the wrong way: change `(x + denom - 1) / denom` (ceil) to `x / denom` (floor), so size/capacity calculations under-allocate by exactly one unit when `x` is not a clean multiple of `denom`. The off-by-one allocation only corrupts memory when the final element is actually written."
    - "Change the base in a polynomial/CRC/hash accumulator: flip a multiplier constant (e.g., `31 * hash + c` to `33 * hash + c`, or the CRC polynomial from `0xedb88320` to `0xedb88320 ^ 1`), so the checksum/hash diverges from the expected value only when verified against persisted data. New writes still round-trip; data written by any previous build or by other peers now fails verification."
    - "Reverse the direction of a two-operand comparison subtly: change `Compare(a, b)` returning `a - b` (signed) to returning `b - a`, or flip `<` to `>` inside a `CompareKeys`/`FindGreaterOrEqual` path. The skip-list or sorted iterator still appears ordered locally but inserts/searches land on the wrong neighbor for near-equal keys, corrupting ordered iteration long after the bug is introduced."
    - "Misweight a moving-average or score accumulator: change a `total += delta` that should be `total += delta * weight` (or vice versa) inside a compaction-score / level-score / write-rate computation, so the scheduler consistently picks the wrong level to compact. Writes still succeed; space amplification grows unboundedly over time."
    - "Drop a correction term from a modular-arithmetic expression: in a sequence-number or version-edit counter, change `next = (cur + delta) % modulus` to `next = cur + delta` (assuming no wrap), so the wraparound case silently skips the modulo and produces a value the reader rejects."
    - "Use the wrong operand as the divisor/denominator: change `bytes_per_sec = total_bytes / elapsed_sec` to `bytes_per_sec = elapsed_sec / total_bytes`, or `avg = sum / count` to `avg = sum / sum`. The function still returns a plausible non-zero value on many inputs so the bug is not immediately obvious in smoke tests."
    - "Shift off-by-one in a bit-packed decoder: when decoding a field at bit offset `k` of width `w`, change `(value >> k) & ((1 << w) - 1)` to `(value >> (k+1)) & ((1 << w) - 1)` or widen the mask to `(1 << (w+1)) - 1`. Small values still decode correctly; values that use the high bit of the field decode to a silently wrong number."
    - "Confuse inclusive vs. exclusive range in an interval computation: change `overlap = (a_end >= b_start) && (b_end >= a_start)` to `overlap = (a_end > b_start) && (b_end > a_start)`, so two ranges that touch at exactly one point are reported as non-overlapping. Compaction / range-delete logic then silently skips work on adjacent ranges."
    - "Misapply a unit conversion constant: change a size computation that multiplies by `1024` (KiB) to multiply by `1000` (kB), or a millisecond/microsecond mix-up (`* 1000` vs `* 1000000`). Sizes / timeouts are off by 2.4% / 1000x respectively, which passes most unit tests but breaks production capacity planning or timeouts."
    - "Use the post-update value where the pre-update value is required (or vice versa) in a running arithmetic computation: e.g., inside a block builder, change `last_key_size = keys_total - prev_keys_total; prev_keys_total = keys_total;` to update `prev_keys_total` before computing `last_key_size`, making `last_key_size` always 0. Downstream size estimates drift."
  tips:
    - "The bug must be a realistic incorrect-calculation flaw (CWE-682) — a wrong formula, a wrong constant, a wrong operator, a wrong rounding direction, or an off-by-one — not a removed validator and not an overflow."
    - "The calculation must still produce a plausible-looking numeric result on common inputs. If the wrong formula makes the function obviously broken on any trivial input, pick a different formula to corrupt."
    - "Prefer bugs whose effect manifests LATE — corrupt persisted data, corrupt iteration order, wrong compaction decisions, wrong size accounting — not bugs that crash on the first call. The goal is 'very difficult bugs' that survive casual testing."
    - "Preserve the function signature and documentation. Do not rename identifiers. Do not re-order arguments in the signature."
    - "Do not introduce compilation errors; types and operand kinds must still line up."
    - "Do not add comments that hint at the flaw or mention calculation, off-by-one, formula, CWE, or bug."
    - "Prefer modifying exactly ONE arithmetic expression, loop bound, comparison, or constant over restructuring the function. A single-token or single-operator change is ideal."
    - "If the function is a checksum/CRC/hash routine, mutating the polynomial, initial value, or finalization XOR is high-value — the function still returns a uint but no longer matches persisted data."
    - "If the function is a size/offset/capacity calculation consumed by an allocator or writer, off-by-one or wrong-rounding bugs silently corrupt memory only at boundary sizes — also high-value."
    - "Do NOT turn this into a security-boundary bug by removing a bounds check. That is CWE-20 / CWE-125 / CWE-787 territory. Stay in 'the math is wrong, the result is quietly incorrect' territory."
    - "If the function is trivially a single-line getter, an assignment of a constant, or a straight passthrough with no computation, you may respond with 'NO_GOOD_BUG_SITE' instead of forcing a contrived change."
system: |-
  You are a security researcher performing adversarial bug injection to build a training dataset for automated vulnerability-detection and -repair agents.

  Your job is to rewrite the given function so it contains a realistic CWE-682 flaw (Incorrect Calculation). The resulting function must still compile, keep its signature, and produce plausible-looking output on common inputs — the flaw should be a subtle wrongness in a formula, loop bound, operator, rounding direction, constant, or comparison that causes silently incorrect arithmetic, silently incorrect ordering, or silently corrupt state that manifests only on edge inputs or after the wrong value has propagated into persisted data or downstream bookkeeping.

  The bar is high: this is meant to produce bugs that pass a reviewer's eye on a casual diff read, pass most unit tests, and only reveal themselves under adversarial inputs, edge cases, long-running workloads, data written by other versions, or boundary-size allocations. Avoid crash-on-first-call mutations. Avoid mutations that are indistinguishable from a chaos-monkey random edit.

  Concretely, some kinds of CWE-682 bugs you should consider introducing:
  {% for bug in (bug_examples | shuffle)[:3] %}
  - {{ bug -}}
  {% endfor %}

  Tips about the bug-introducing task:
  {% for tip in tips | shuffle %}
  - {{ tip -}}
  {% endfor %}

  Your answer should be formatted as follows:

  Explanation:
  <explanation of what you changed, the exact arithmetic/operator/bound mutated, and why it is a realistic CWE-682 flaw that would survive casual review — this explanation is for dataset metadata and will not appear in code>

  Bugged Code:
  ```
  <bugged_code>
  ```
demonstration: ""
instance: |-
  <INPUT>
  {{src_code}}
  </INPUT>

  <IMPORTANT>As a reminder, Please DO NOT INCLUDE ANY COMMENTS IN THE CODE OR POINT OUT THE BUG IN ANY WAY. The bugged function must compile and preserve its signature. Prefer a single-token or single-operator mutation. If the function genuinely has no good CWE-682 site (e.g., trivial getter, constant return, straight passthrough, no arithmetic/comparison/loop), then respond with ONLY the bare line `NO_GOOD_BUG_SITE` on its own — do NOT wrap it in a code block, do NOT include an Explanation section, do NOT include a Bugged Code section. Any response without a fenced ```code``` block will be treated as a decline and discarded.</IMPORTANT>

