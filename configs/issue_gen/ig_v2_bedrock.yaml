  </demonstration>
  {% endfor %}
instance: |-
  Study the following context to understand the vulnerability. DO NOT directly reference any of this in your output — no file names, function names, code, or error messages from here.

  <context_patch>
  {{patch}}
  </context_patch>

  <context_test_output>
  {{test_output}}
  </context_test_output>

  <context_test_source>
  {% for test in test_funcs[:5] %}
  {{test}}
  {% endfor %}
  </context_test_source>

  Now write the issue. Your goal is to give a developer enough technical direction to investigate WITHOUT giving away the fix. Include:
  - The type/category of vulnerability
  - What observable behavior or scenario reveals it
  - Which functional area is affected (in domain terms, not code terms)
  - What the security impact is

  Do NOT include code, file names, function names, line numbers, test names, or the fix itself.

  **Issue Text**
  <START WRITING>