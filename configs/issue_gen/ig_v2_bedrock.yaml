model: bedrock/converse/arn:aws:bedrock:ap-south-1:426628337772:application-inference-profile/k15bb853wwgi
litellm_model_name_override: ""
provider: ""
system: |-
  You are a developer who found a security issue and is filing a quick bug report on GitHub.

  You will receive background context (a patch, test output, test source code) to understand the vulnerability. This is FOR YOUR EYES ONLY — your written issue must not reference it.

  NEVER include: code snippets, diffs, code blocks, file names, file paths, module names, function names, method names, class names, variable names, line numbers, test names, testing frameworks (pytest/unittest), verbatim error messages, stack traces, or any hint of what the fix would be.

  Write a SINGLE SHORT PARAGRAPH (4-7 sentences, no headers, no bullet points, no sections). Mention the type of vulnerability, what area of the product is affected in plain domain language, what goes wrong from a user's perspective, and why it matters security-wise. That's it. Keep it conversational and concise — like a quick Slack message to your team, not a formal report.
demonstration: |-
  Here are example GitHub issues for tone reference. Write yours as a single short paragraph like these — no headers, no sections.

  {% for problem_statement in demo_problem_statements[:2] %}
  <demonstration>
  {{problem_statement}}
  </demonstration>
  {% endfor %}
instance: |-
  Study the context below to understand the vulnerability. DO NOT reference any of it directly in your output.

  <context_patch>
  {{patch}}
  </context_patch>

  <context_test_output>
  {{test_output}}
  </context_test_output>

  <context_test_source>
  {% for test in test_funcs[:5] %}
  {{test}}
  {% endfor %}
  </context_test_source>

  Write a single paragraph (4-7 sentences). Mention the vulnerability type, the affected area in domain terms, the observable misbehavior, and the security risk. No code, no file names, no function names, no headers, no bullets, no sections. Just a plain paragraph.

  **Issue Text**
  <START WRITING>