name: lm_modify_cwe416
parameters:
  cwe_id: "CWE-416"
  cwe_name: "Use After Free"
  bug_examples:
    - "Drop a `jv_copy()` call at a use-site where the same `jv` value is consumed twice. For example, change `f(jv_copy(x)); g(x);` to `f(x); g(x);` so `f` decrements the refcount and `g` later operates on (or frees) an already-dead value. The function returns normally; the use-after-free manifests only when `g`'s result is later inspected or freed by the caller."
    - "Replace `jv_free(x); return y;` on an error path with `return y;` (leak the error-path reference) or, conversely, replace `return y;` on a happy path with `jv_free(x); return y;` where `x` is still logically owned downstream. The first variant is a silent refcount leak, the second is a use-after-free when the downstream owner eventually touches `x`."
    - "Change the order of `jv_free(a); jv_free(b);` when `b` internally references `a` (e.g., an object's slot holds a refcount to its key string). Freeing `a` first drops the backing storage; the subsequent `jv_free(b)` walks into freed memory when it tries to release `b`'s internal slots."
    - "In a function that takes ownership of a `jv` argument, add a spurious `jv_copy(arg)` early and then `jv_free(arg)` at exit without freeing the copy. Refcount silently drifts upward on every call; heap grows unboundedly under sustained workloads but nothing crashes in short test runs."
    - "Inside a loop that accumulates into a `jv` array/object via a mutator that returns a new `jv` (e.g., `jv_set`, `jv_setpath`, `jv_object_merge`), change `acc = jv_set(acc, k, v);` to `jv_set(acc, k, v);` where the old `acc` is kept as the loop variable. The returned value owns the updated storage; the old `acc` now holds a stale pointer into freed internals, and subsequent iterations read freed memory. Do NOT apply this pattern to functions already annotated `warn_unused_result` or whose return value is already used on every branch."
    - "Double-free on a conditional branch: change `if (cond) { jv_free(x); return err; } return f(x);` to `if (cond) { jv_free(x); return err; } jv_free(x); return f(jv_copy(x));`, so the happy path frees `x` before/after `f` consumes it. The immediate call to `f(jv_copy(x))` still works; the extra `jv_free(x)` decrements a refcount that no longer owns the underlying storage."
    - "Omit `jvp_refcnt_inc()` on a refcount pointer that is duplicated into a second holder. For instance in a table-resize or slot-move path, the code copies the `jv_refcnt*` pointer into a new slot without incrementing the count; when the original holder later frees its reference, the new slot points into freed memory."
    - "Swap `jv_copy(x)` for a bitwise copy (`jv y = x;`) at a site where `x` is subsequently freed on a divergent control-flow branch. Both `x` and `y` now share the underlying refcount pointer with only one logical increment; whichever branch frees first leaves the other holding a dangling pointer."
    - "On an error-return path inside a function that constructs a composite `jv` (object/array), free the partially-built composite but continue using one of its internal slot values that the composite had already taken ownership of. The slot pointer is valid until the composite free; after the composite is freed, the slot's backing storage is gone."
  tips:
    - "The bug must be a realistic use-after-free, double-free, or refcount-imbalance flaw in jq's manual `jv` refcounting (CWE-416 / CWE-415 / CWE-672 family) — a missing `jv_copy`, a missing `jvp_refcnt_inc`, a misplaced `jv_free`, a swapped copy-on-write guard, or an ignored return value from a mutator that returns a new `jv`."
    - "Do NOT introduce a bug that crashes on the very first call with simple inputs. The goal is 'very difficult bugs' that pass all trivial tests and only manifest when a `jv` is aliased across two holders, when an error path is taken, when a container is resized, or after sustained use."
    - "Preserve the function signature, the return type, and the documented behavior on happy-path inputs. Do not rename identifiers. Do not reorder parameters."
    - "Do not introduce compilation errors. `jv` is passed by value; `jv_refcnt*` is a pointer; types and const-qualification must still line up."
    - "Do not add comments that hint at the flaw or mention use-after-free, double-free, refcount, leak, CWE, or bug. Do not name a new variable in a way that hints at ownership confusion."
    - "Prefer mutating exactly ONE ownership operation: one `jv_copy` removed, one `jv_free` moved, one `jvp_refcnt_inc` omitted, one return-value of a mutator ignored. A single-line or single-token mutation is ideal."
    - "Do NOT remove bounds checks, null checks, or input validators. That is CWE-125 / CWE-20 / CWE-476 territory — out of scope for this config. Stay strictly in ownership/refcount semantics."
    - "Do NOT introduce integer overflow, off-by-one arithmetic, or wrong-formula math. That is CWE-190 / CWE-193 / CWE-682 territory — out of scope. Stay strictly in ownership/refcount semantics."
    - "Do NOT introduce threading primitives, mutexes, locks, atomics, or race conditions. jq is single-threaded except for floating-point thread-local storage (`src/jv_dtoa_tsd.c`). Ownership bugs must be sequential, not concurrent. A patch that adds a thread or lock is out of scope and will be rejected."
    - "Do NOT inject bugs into auto-generated files: `src/lexer.c` (flex-generated), `src/parser.c` (bison-generated), or any file whose header comment says it is auto-generated. These files are regenerated during build and any hand-injected bug will be lost or will break parser regeneration. Respond with `NO_GOOD_BUG_SITE` for these files. Target hand-written ownership code only."
    - "High-value targets in jq: functions in `src/jv.c`, `src/jv_aux.c`, `src/execute.c`, `src/builtin.c`, `src/jv_parse.c`, `src/jv_print.c` that touch `jv_copy`, `jv_free`, `jvp_refcnt_inc`, `jvp_refcnt_dec`, `jvp_refcnt_unshared`, `jv_array_append`, `jv_array_set`, `jv_object_set`, `jv_object_delete`, or any function returning a `jv` that takes ownership of a `jv` parameter."
    - "If the function does not participate in `jv` ownership — for example a pure numeric helper, a lexer utility that operates only on `char*`, a dtoa routine, a bytecode opcode table, a log/trace printer, or a trivial getter — then respond with `NO_GOOD_BUG_SITE` instead of forcing a contrived change."
    - "Prefer bugs whose effect is detectable only under address-sanitizer, under long-running workloads, or only when the same `jv` happens to be referenced by two holders across a `jq_next` / `jq_eval` boundary. Bugs that segfault on the first call are worthless for this dataset."
system: |-
  You are a security researcher performing adversarial bug injection to build a training dataset for automated vulnerability-detection and -repair agents.

  Your job is to rewrite the given function so it contains a realistic CWE-416 (Use After Free) or closely related refcount-ownership flaw (CWE-415 Double Free, CWE-672 Operation on a Resource after Expiration or Release) in jq's manual `jv` refcounting. The resulting function must still compile, keep its signature, and produce plausible-looking output on common inputs — the flaw should be a subtle ownership error that only manifests when a `jv` is aliased across two holders, when an error path is taken, when a container is resized, or after sustained use.

  Context on jq's memory model. Every `jv` is a tagged 128-bit struct. Composite kinds (string, array, object, number-literal, invalid-with-message) carry a pointer into a heap refcount block. `jv_copy(x)` increments the refcount and returns a new `jv` that aliases the same heap; `jv_free(x)` decrements the refcount and releases the heap at count 0. `jvp_refcnt_unshared(p)` returns true iff count==1, which is how mutators decide copy-on-write vs in-place mutation. Functions that take `jv` parameters by value almost always take ownership — i.e., the caller must not free them after the call. Functions that return `jv` almost always return a fresh owned value.

  The bar is high: this is meant to produce bugs that pass a reviewer's eye on a casual diff read, pass jq's `make check` test suite, and only reveal themselves under address-sanitizer, under long-running workloads, or when a pipeline stage aliases the same `jv` across boundaries. Avoid crash-on-first-call mutations. Avoid mutations that are indistinguishable from a chaos-monkey random edit.

  Concretely, some kinds of CWE-416 / CWE-415 bugs you should consider introducing:
  {% for bug in (bug_examples | shuffle)[:3] %}
  - {{ bug -}}
  {% endfor %}

  Tips about the bug-introducing task:
  {% for tip in tips | shuffle %}
  - {{ tip -}}
  {% endfor %}

  Your answer should be formatted as follows:

  Explanation:
  <explanation of what you changed, the exact ownership operation mutated, and why it is a realistic CWE-416 / CWE-415 flaw that would survive casual review — this explanation is for dataset metadata and will not appear in code>

  Bugged Code:
  ```
  <bugged_code>
  ```
demonstration: ""
