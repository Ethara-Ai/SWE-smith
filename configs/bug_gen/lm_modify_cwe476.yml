name: lm_modify_cwe476
parameters:
  cwe_id: "CWE-476"
  cwe_name: "NULL Pointer Dereference"
  bug_examples:
    - "Remove a null/undefined check before property access: delete `if (obj == null) return defaultValue;` before `obj.property`, so when a lookup/allocation returns null, accessing the property throws TypeError."
    - "Remove the optional chaining operator: change `result?.data?.items` to `result.data.items` where `result` can be null/undefined from a failed API call or cache miss."
    - "Remove a null check after a Map/Set lookup: delete `if (!entry) return undefined;` after `const entry = map.get(key);` then immediately access `entry.value`, crashing when the key doesn't exist."
    - "Remove the nullish coalescing fallback: change `const config = loadConfig() ?? DEFAULT_CONFIG;` to `const config = loadConfig();` where loadConfig() returns null on missing file, then access `config.port`."
    - "Remove a guard on an optional callback invocation: delete `if (typeof callback === 'function')` before `callback(result)`, crashing when the caller didn't provide an optional callback parameter."
    - "Remove the existence check before array destructuring: delete `if (!result || !result.rows) return [];` before `const [first] = result.rows;` where result can be null from a failed query."
    - "Move a null check after the dereference: move `if (node === null) return;` to AFTER `const type = node.type;`, so the dereference happens unconditionally before the null check catches it."
    - "Remove a prototype chain safety check: delete `if (!Object.prototype.hasOwnProperty.call(registry, name)) return null;` before `return registry[name].handler()`, crashing when name doesn't exist in registry."
  tips:
    - "The bug must be a realistic null/undefined dereference (CWE-476) — a reference that can be null/undefined on an uncommon path is accessed without checking, causing TypeError/crash."
    - "In JavaScript/TypeScript context, CWE-476 manifests as TypeError: Cannot read properties of null/undefined. This happens when optional chaining, null checks, or nullish coalescing are removed."
    - "CRITICAL DISTINCTION from CWE-754 (Improper Check for Unusual Conditions): CWE-754 covers missing checks for any unusual condition (error codes, empty results, edge cases). CWE-476 specifically targets null/undefined DEREFERENCE — the null value is accessed as if it were an object."
    - "CRITICAL DISTINCTION from CWE-252 (Unchecked Return Value): CWE-252 is about ignoring a return value entirely. CWE-476 is about USING a return value without checking if it's null first."
    - "CRITICAL DISTINCTION from CWE-824 (Access of Uninitialized Pointer): CWE-824 is about variables that were never assigned. CWE-476 is about variables that were assigned NULL from a legitimate code path (failed lookup, missing config, error return)."
    - "Preserve the function signature and documentation. Do not rename identifiers."
    - "Do not introduce compilation errors (the code must still be syntactically valid)."
    - "Do not add comments that hint at the flaw, null, undefined, or CWE."
    - "The bug should be subtle: the reference is non-null on the common path (successful lookup, valid input). The crash only occurs on uncommon paths (missing key, failed API call, malformed input)."
    - "Prefer removing exactly ONE null check, optional chaining operator, or nullish coalescing fallback."
    - "High-value targets: Map.get() results, Array.find() results, regex match results, JSON parsed values, database query results, DOM querySelector results, optional function parameters."
    - "If the function has no nullable references, no lookups that can fail, no optional parameters — respond with `NO_GOOD_BUG_SITE`."
system: |-
  You are a security researcher performing adversarial bug injection to build a training dataset for automated vulnerability-detection and -repair agents.

  Your job is to rewrite the given function so it contains a realistic CWE-476 flaw (NULL Pointer Dereference). The resulting function must still compile, keep its signature, and work on the common path — the flaw should cause a null/undefined dereference crash (TypeError) on an uncommon path where a lookup, allocation, or API call returns null/undefined.

  In JavaScript/TypeScript, CWE-476 manifests as `TypeError: Cannot read properties of null/undefined` when optional chaining (`?.`), null checks (`if (x == null)`), or nullish coalescing (`??`) are removed. The crash occurs on paths where the value is legitimately null (missing key, failed query, absent optional param). This is distinct from CWE-754 (general unusual condition handling), CWE-252 (ignoring return values), and CWE-824 (uninitialized variables).

  Concretely, some kinds of CWE-476 bugs you should consider introducing:
  {% for bug in (bug_examples | shuffle)[:3] %}
  - {{ bug -}}
  {% endfor %}

  Tips about the bug-introducing task:
  {% for tip in tips | shuffle %}
  - {{ tip -}}
  {% endfor %}

  Your answer should be formatted as follows:

  Explanation:
  <explanation of what you changed and why it is a CWE-476 flaw — this explanation is for dataset metadata and will not appear in code>

  Bugged Code:
  ```
  <bugged_code>
  ```
demonstration: ""
instance: |-
  <INPUT>
  {{src_code}}
  </INPUT>

  <IMPORTANT>As a reminder, Please DO NOT INCLUDE ANY COMMENTS IN THE CODE OR POINT OUT THE BUG IN ANY WAY. The bugged function must compile and preserve its signature. If the function genuinely has no good CWE-476 site (e.g., no nullable references, no lookups that can return null, no optional parameters — a pure computation on primitives), then respond with ONLY the bare line `NO_GOOD_BUG_SITE` on its own — do NOT wrap it in a code block, do NOT include an Explanation section, do NOT include a Bugged Code section. Any response without a fenced ```code``` block will be treated as a decline and discarded.</IMPORTANT>

