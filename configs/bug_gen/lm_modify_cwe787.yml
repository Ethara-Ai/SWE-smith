name: lm_modify_cwe787
parameters:
  cwe_id: "CWE-787"
  cwe_name: "Out-of-bounds Write"
  bug_examples:
    - "Remove a bounds check before a buffer write: delete a guard like `if (offset + len > buf_size) return error;` before a `memcpy(dst + offset, src, len)`, so a crafted length drives the write past the end of the allocation."
    - "Change a loop bound from `< capacity` to `<= capacity` in a routine that fills a pre-allocated buffer, causing one extra element to be written past the end on the final iteration."
    - "Replace a safe copy helper that validates `src_len <= dst_remaining` with a raw `memcpy` that trusts the source length unconditionally, so an oversized input writes past the destination buffer."
    - "Skip a check that the output buffer is large enough for the result: remove `if (result_len > out_size) return error;` before writing the computed result, trusting that the caller allocated enough space."
    - "Weaken a size check from `>=` to `>` in a reallocation guard, so when the required size exactly equals the current capacity the reallocation is skipped, but the subsequent write appends one element past the end."
    - "Use an untrusted length field directly as the count in a write loop without clamping it to the output buffer size: change `n = min(decoded_len, buf_remaining)` to `n = decoded_len`, so a malformed input can write an arbitrary number of bytes past the buffer."
    - "Drop a saturation/clamp on an index computed from untrusted input before using it to write into a fixed-size table: change `idx = min(raw_idx, TABLE_SIZE - 1)` to `idx = raw_idx`, so out-of-range values write past the table."
    - "Change a post-increment write `buf[pos++] = val` inside a loop to a pre-increment `buf[++pos] = val`, shifting all writes by one position and causing the final write to land one element past the buffer end."
  tips:
    - "The bug must be a realistic out-of-bounds write (CWE-787) — a write past the end (or before the start) of a buffer/array driven by untrusted input, not a random logic change."
    - "Preserve the function signature and documentation. Do not rename identifiers."
    - "Do not introduce compilation errors."
    - "Do not add comments that hint at the flaw or mention bounds, OOB, overflow, or CWE."
    - "The bug should be subtle: the function should still behave correctly on well-formed inputs, and only overwrite when processing adversarial data."
    - "Prefer modifying exactly ONE bounds check / size validation / write-loop bound over restructuring the whole function."
    - "If the function already has a secondary bounds check further down, you can still introduce the bug if the write happens before that check fires."
    - "If the function has no buffer writes, no memcpy/memmove to a destination, no array store operations, and no pointer-based writes (e.g., a pure reader, a trivial getter, or a function that only returns values), respond with `NO_GOOD_BUG_SITE` instead of forcing a contrived change."
system: |-
  You are a security researcher performing adversarial bug injection to build a training dataset for automated vulnerability-detection and -repair agents.

  Your job is to rewrite the given function so it contains a realistic CWE-787 flaw (Out-of-bounds Write). The resulting function must still compile, keep its signature, and behave correctly on benign inputs — the flaw should only manifest when an adversary supplies crafted byte sequences (typically a malformed length, offset, or count from an untrusted file or network payload).

  Concretely, some kinds of CWE-787 bugs you should consider introducing:
  {% for bug in (bug_examples | shuffle)[:3] %}
  - {{ bug -}}
  {% endfor %}

  Tips about the bug-introducing task:
  {% for tip in tips | shuffle %}
  - {{ tip -}}
  {% endfor %}

  Your answer should be formatted as follows:

  Explanation:
  <explanation of what you changed and why it is a CWE-787 flaw — this explanation is for dataset metadata and will not appear in code>

  Bugged Code:
  ```
  <bugged_code>
  ```
demonstration: ""
instance: |-
  <INPUT>
  {{src_code}}
  </INPUT>

  <IMPORTANT>As a reminder, Please DO NOT INCLUDE ANY COMMENTS IN THE CODE OR POINT OUT THE BUG IN ANY WAY. The bugged function must compile and preserve its signature. If the function genuinely has no good CWE-787 site (e.g., a pure reader, a trivial getter, or a function with no buffer writes or pointer-based stores), then respond with ONLY the bare line `NO_GOOD_BUG_SITE` on its own — do NOT wrap it in a code block, do NOT include an Explanation section, do NOT include a Bugged Code section. Any response without a fenced ```code``` block will be treated as a decline and discarded.</IMPORTANT>

