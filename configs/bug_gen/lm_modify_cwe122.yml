name: lm_modify_cwe122
parameters:
  cwe_id: "CWE-122"
  cwe_name: "Heap-based Buffer Overflow"
  bug_examples:
    - "Remove a size check before writing into a heap-allocated Buffer: delete `if (data.length > allocatedSize) throw` before writing into a `Buffer.alloc(allocatedSize)` in a native addon binding, so heap memory after the buffer is corrupted."
    - "Miscalculate the allocation size for a heap buffer in a native addon: use `malloc(numElements)` instead of `malloc(numElements * sizeof(element))` in N-API code, then write the full element array into the undersized heap allocation."
    - "Remove the realloc/resize check when a dynamic buffer grows: delete the capacity check in a custom dynamic-buffer class so that `this.buffer.copy(newBuffer)` happens with a `newBuffer` that's too small when the buffer needed to grow."
    - "Use Buffer.allocUnsafe(userSize) with an unchecked userSize that can be negative: if `userSize` is -1, `Buffer.allocUnsafe(-1)` may allocate a very large buffer or (in native addons) cause integer underflow leading to small allocation + large write."
    - "Remove bounds validation before napi_get_buffer_info + memcpy: in a native addon, get the JS Buffer pointer via `napi_get_buffer_info` then `memcpy(heap_buf, js_buf, js_buf_len)` where `heap_buf` was allocated smaller than `js_buf_len`."
    - "Remove the length cap on a dynamically-resized array buffer: delete `if (newLength > MAX_CAPACITY) throw` in a growable buffer implementation, so an attacker can trigger writes beyond the current heap allocation before resize occurs."
    - "Pass user-controlled size to a heap allocation without upper-bound validation: use `new ArrayBuffer(userSize)` or `Buffer.alloc(userSize)` and then write a fixed-size header that assumes minimum size, but `userSize` can be 0, causing subsequent writes to overflow (in native interop)."
    - "Remove the overflow check in a concatenation of heap buffers: in `Buffer.concat([buf1, buf2])` replacement code, allocate `buf1.length + buf2.length` without checking for integer overflow, so on 32-bit systems the sum wraps to a small number while the copy writes the full amount."
  tips:
    - "The bug must be a realistic CWE-122 flaw — a write operation overflows a HEAP-ALLOCATED buffer (malloc'd, new'd, Buffer.alloc'd) specifically. The corruption target is heap metadata or adjacent heap objects."
    - "Do NOT introduce bugs better classified as CWE-121 (Stack-based Buffer Overflow). CWE-122 is SPECIFICALLY about HEAP memory (dynamically allocated). If the overflow targets a stack-allocated buffer (local array, alloca), that is CWE-121."
    - "Do NOT introduce bugs better classified as CWE-120 (Buffer Copy without Checking Size). CWE-120 is the general copy-without-check. CWE-122 adds the constraint that the target is HEAP-ALLOCATED. Use CWE-122 when you can clearly identify the heap allocation."
    - "Do NOT introduce bugs better classified as CWE-131 (Incorrect Buffer Size Calculation). If the root cause is the ALLOCATION size being computed wrong, that is CWE-131. CWE-122 applies when the allocation is correct but the WRITE exceeds it."
    - "In JavaScript, true heap overflows require native addon code (N-API, node-gyp with C/C++). Pure JS Buffer operations are bounds-checked by V8. Focus examples on native interop, WASM memory, or scenarios where integer overflow in size calculations leads to undersized allocations."
    - "Preserve the function signature and documentation. Do not rename identifiers."
    - "Do not introduce compilation errors or syntax errors."
    - "Do not add comments that hint at the flaw, heap overflow, buffer, allocation, or CWE."
    - "The bug should be subtle: normal-sized inputs within typical ranges work correctly. The overflow only manifests with crafted oversized or edge-case inputs."
    - "Prefer removing exactly ONE size check or introducing ONE allocation-size miscalculation that leads to heap overflow."
    - "High-value targets: native addon buffer operations, binary protocol parsers with dynamic buffers, image/video codec bindings, crypto library wrappers that allocate output buffers, any N-API code with malloc/calloc + memcpy."
    - "If the function has no heap buffer allocations, no native addon code, no dynamic buffer management, respond with `NO_GOOD_BUG_SITE` instead of forcing a contrived change."
system: |-
  You are a security researcher performing adversarial bug injection to build a training dataset for automated vulnerability-detection and -repair agents.

  Your job is to rewrite the given function so it contains a realistic CWE-122 flaw (Heap-based Buffer Overflow). The resulting function must still compile, keep its signature, and work for normal inputs — the flaw should allow a write operation to overflow a heap-allocated buffer, corrupting adjacent heap memory or heap metadata.

  CWE-122 is a child of CWE-787 (Out-of-bounds Write) and CWE-120 (Buffer Copy without Checking Size), specifically targeting HEAP-allocated memory (malloc, calloc, new, Buffer.alloc in native contexts). Heap overflows can corrupt heap metadata enabling arbitrary write primitives, or overwrite adjacent heap objects. In Node.js native addons, this is a critical vulnerability class.

  Concretely, some kinds of CWE-122 bugs you should consider introducing:
  {% for bug in (bug_examples | shuffle)[:3] %}
  - {{ bug -}}
  {% endfor %}

  Tips about the bug-introducing task:
  {% for tip in tips | shuffle %}
  - {{ tip -}}
  {% endfor %}

  Your answer should be formatted as follows:

  Explanation:
  <explanation of what you changed and why it is a CWE-122 flaw — this explanation is for dataset metadata and will not appear in code>

  Bugged Code:
  ```
  <bugged_code>
  ```
demonstration: ""
instance: |-
  <INPUT>
  {{src_code}}
  </INPUT>

  <IMPORTANT>As a reminder, Please DO NOT INCLUDE ANY COMMENTS IN THE CODE OR POINT OUT THE BUG IN ANY WAY. The bugged function must compile and preserve its signature. If the function genuinely has no good CWE-122 site (e.g., no heap buffer allocations, no native addon code, no dynamic buffer management), then respond with ONLY the bare line `NO_GOOD_BUG_SITE` on its own — do NOT wrap it in a code block, do NOT include an Explanation section, do NOT include a Bugged Code section. Any response without a fenced ```code``` block will be treated as a decline and discarded.</IMPORTANT>

  OUTPUT:
