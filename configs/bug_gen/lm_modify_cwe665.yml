name: lm_modify_cwe665
parameters:
  cwe_id: "CWE-665"
  cwe_name: "Improper Initialization"
  bug_examples:
    - "Remove the initialization of a struct field that is only written on a conditional branch, so when that branch is not taken the field retains its garbage/default value: delete `result.status = OK;` before a conditional block that only sets `result.status` on error, leaving it uninitialized on the happy path."
    - "Change a zero-initialization of a buffer (`memset(buf, 0, size)`) to an allocation without clearing (`malloc(size)` without `memset`), so leftover heap data from a previous allocation leaks into the output when the buffer is only partially filled."
    - "Move a variable initialization from before a loop to inside the loop body, so the accumulator is reset on every iteration instead of once: change `int total = 0; for (...) { total += x; }` to `for (...) { int total = 0; total += x; }`, losing all but the last iteration's contribution."
    - "Replace a designated initializer that sets all fields (`= {.a = 0, .b = 0, .c = NULL}`) with a partial initializer (`= {.a = 0}`), leaving fields `.b` and `.c` at whatever the compiler/platform gives them (zero in C99 for aggregates, but garbage in C++ POD types or when the struct is on the stack in an older standard)."
    - "Delete a `memset(&ctx, 0, sizeof(ctx))` that clears a crypto/hash/compression context before first use, so stale data from a prior context on the same stack frame contaminates the new computation. The output is still a valid hash/checksum — just not the correct one."
    - "Swap the initialization order of two interdependent variables: if `a` must be computed before `b` because `b = f(a)`, reorder so `b = f(a)` executes before `a` is assigned, making `b` depend on `a`'s stale/uninitialized value."
    - "Replace a constructor/init call that sets a sentinel value (e.g., `node->next = NULL`, `fd = -1`, `ptr = nullptr`) with a no-op, so the sentinel check later (`if (ptr != NULL)`) passes on garbage and the code dereferences or closes a wild pointer/descriptor."
    - "Remove a re-initialization at the top of a reusable-object's `Reset()`/`Clear()` method, so the object silently carries over state from its previous use into its next use. The first use is correct; the second use operates on stale data."
  tips:
    - "The bug must be a realistic improper-initialization flaw (CWE-665) — a variable, buffer, struct field, or context object is not properly initialized before first use, or is initialized with the wrong value, or has its initialization deleted/moved."
    - "Preserve the function signature and documentation. Do not rename identifiers."
    - "Do not introduce compilation errors; uninitialized variables must still be declared with a valid type."
    - "Do not add comments that hint at the flaw or mention initialization, uninitialized, CWE, or bug."
    - "The bug should be subtle: on common inputs the uninitialized field may happen to be zero (stack/heap often is in debug builds) and the function appears correct; the bug only manifests in release builds, under memory pressure, or when the function is called repeatedly."
    - "Prefer modifying exactly ONE initialization statement (one memset, one assignment, one constructor call) over restructuring the whole function."
    - "Do NOT remove bounds checks or input validators — that is CWE-20 / CWE-125 territory. Stay strictly in 'the value was not properly set up before use' territory."
    - "If the function has no local variables, no struct initialization, no buffer allocation, and no state setup (e.g., a trivial getter, a single-expression return, or a pure forwarding wrapper), respond with `NO_GOOD_BUG_SITE` instead of forcing a contrived change."
system: |-
  You are a security researcher performing adversarial bug injection to build a training dataset for automated vulnerability-detection and -repair agents.

  Your job is to rewrite the given function so it contains a realistic CWE-665 flaw (Improper Initialization). The resulting function must still compile, keep its signature, and appear to work correctly in quick tests — the flaw should be a missing, incomplete, or misordered initialization that causes the function to operate on stale, garbage, or wrong initial values under specific conditions (release builds, repeated calls, partial code paths, memory pressure).

  Concretely, some kinds of CWE-665 bugs you should consider introducing:
  {% for bug in (bug_examples | shuffle)[:3] %}
  - {{ bug -}}
  {% endfor %}

  Tips about the bug-introducing task:
  {% for tip in tips | shuffle %}
  - {{ tip -}}
  {% endfor %}

  Your answer should be formatted as follows:

  Explanation:
  <explanation of what you changed and why it is a CWE-665 flaw — this explanation is for dataset metadata and will not appear in code>

  Bugged Code:
  ```
  <bugged_code>
  ```
demonstration: ""
instance: |-
  <INPUT>
  {{src_code}}
  </INPUT>

  <IMPORTANT>As a reminder, Please DO NOT INCLUDE ANY COMMENTS IN THE CODE OR POINT OUT THE BUG IN ANY WAY. The bugged function must compile and preserve its signature. If the function genuinely has no good CWE-665 site (e.g., a trivial getter, a single-expression return, or a pure forwarding wrapper with no local state setup), then respond with ONLY the bare line `NO_GOOD_BUG_SITE` on its own — do NOT wrap it in a code block, do NOT include an Explanation section, do NOT include a Bugged Code section. Any response without a fenced ```code``` block will be treated as a decline and discarded.</IMPORTANT>

